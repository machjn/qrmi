# QuantumResource for Alice & Bob Felis
#
# Prerequisites:
#   kubectl create secret generic alice-bob-felis-credentials \
#     --from-literal=api-key=<your-api-key> \
#     -n platform-qrmi
#
# The operator resolves secretRefs from its own namespace (platform-qrmi),
# so Jobs and claims using this resource can be in any namespace.
apiVersion: quantum.qrmi.io/v1alpha1
kind: QuantumResource
metadata:
  name: ab-emu-1q-lescanne-2020
spec:
  resourceType: alice-bob-felis
  resourceId: ab_emu_1q_lescanne_2020
  envVars:
    QRMI_AB_FELIS_BASE_ENDPOINT: "https://api.alice-bob.com"
  secretRefs:
    - secretName: alice-bob-felis-credentials  # pragma: allowlist secret
      secretKey: api-key  # pragma: allowlist secret
      envVarName: QRMI_AB_FELIS_API_KEY
